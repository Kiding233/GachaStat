# ── 保底配置（P55 扁平化格式） ──────────────────────────────
# 支持 type: soft_interval / soft_additive / soft_step / hard
# 事件驱动型 (rotating/targeted 等) 由 P56 交付

[[pity]]
name = "ssr_soft"
type = "soft_interval"
scope = "ssr"
start = 80
end = 90
target_featured = true
reset = "featured"
