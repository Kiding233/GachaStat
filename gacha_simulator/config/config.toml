# ═══ P78 交替里程碑示例——周期触发时奖励 A/B 交替循环（如终末地武器池 100/180/260/340）═══
# offset = 首节点相位偏移（threshold + offset = 首次触发，如 80 + 20 = 100）
# alternate_rewards = 交替奖励序列——每次触发取下一条、索引模长度循环
# banner = 必须显式绑定一个 Banner（ISSUE-103）：banner='' 时计数器对每个 Banner 的
#   每次 after_draw 都递增，多 Banner 下节点按全池合计抽数计（首节点漂移）。此处绑定
#   pool_c1 作演示——真实终末地武器池场景须绑定对应武器池 Banner id。
# 注意：无交替/零偏移里程碑不必写 alternate_rewards/offset 键（条件写键自动省略）
[[milestone]]
name = "milestone_example_alternate"
threshold = 80
offset = 20
repeat = true
max_triggers = 0
banner = "pool_c1"
alternate_rewards = [
    { resources = { endfield_supply_voucher = 1 } },   # 100, 260, 420…  武库箱券
    { cards = ["standard_ssr_1"] },                    # 180, 340, 500…  UP 卡
]

