# ── 分布模板（原 pools/character_pool.txt + standard_pool.txt + weapon_pool.txt） ──

# 模板1：角色限定池（SSR 0.4%，featured/offrate 各 50%）
[[distribution_templates]]
name = "character_pool_with_offrate"

[[distribution_templates.cards]]
card_id = "ssr"
probability = 0.2          # 0.4% × 50% = 0.2%
rarity = "ssr"
featured = true

[[distribution_templates.cards]]
card_id = "ssr_alt"
probability = 0.2          # 0.4% × 50% = 0.2%
rarity = "ssr"

[[distribution_templates.cards]]
card_id = "sr"
probability = 5.1
rarity = "sr"

[[distribution_templates.cards]]
card_id = "r"
probability = 94.5
rarity = "r"

# 模板2：常驻池（SSR 0.6%，三路均分 a/b/c）
# 原 standard_pool.txt: [1]=[a,b,c] → a:ssr, b:ssr_alt1, c:ssr_alt2
[[distribution_templates]]
name = "standard_pool"

[[distribution_templates.cards]]
card_id = "ssr"
probability = 0.3          # 0.6% × 50% = 0.3%
rarity = "ssr"
featured = true

[[distribution_templates.cards]]
card_id = "ssr_alt1"
probability = 0.15         # 0.6% × 25% = 0.15%
rarity = "ssr"

[[distribution_templates.cards]]
card_id = "ssr_alt2"
probability = 0.15         # 0.6% × 25% = 0.15%
rarity = "ssr"

[[distribution_templates.cards]]
card_id = "sr"
probability = 5.1
rarity = "sr"

[[distribution_templates.cards]]
card_id = "r"
probability = 94.3
rarity = "r"

# 模板3：武器池（SSR 0.7%，featured/offrate 75/25）
# 原 weapon_pool.txt: [1]:0.007 → [featured]:0.75 / [offrate]:0.25
[[distribution_templates]]
name = "weapon_pool"

[[distribution_templates.cards]]
card_id = "ssr"
probability = 0.525        # 0.7% × 75% = 0.525%
rarity = "ssr"
featured = true

[[distribution_templates.cards]]
card_id = "ssr_alt"
probability = 0.175        # 0.7% × 25% = 0.175%
rarity = "ssr"

[[distribution_templates.cards]]
card_id = "sr"
probability = 5.1
rarity = "sr"

[[distribution_templates.cards]]
card_id = "r"
probability = 94.2
rarity = "r"

