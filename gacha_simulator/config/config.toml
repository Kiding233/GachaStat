# ============================================================
# GachaStat 统一配置文件 —— config.toml
# ============================================================
# 此文件等价于原有 10 个 txt 配置文件 + pools/ 子目录的集合。
# 语法速查：
#   key = value          标量（整数/浮点/布尔/字符串）
#   [section]            表（字典）—— . 号嵌套子表
#   [[array]]            数组表——每个 [[array]] 是数组中的一个元素
#   { k = v, k = v }     内联表——写在一行的小字典
# ============================================================

# ── 资源定义（原 resources.txt） ────────────────────────────
[resources.defs]
draw_resource = "抽卡资源"
exchange_currency = "兑换货币"

# ── 初始资源（原 initial_resources.txt） ────────────────────
[resources.initial]
draw_resource = 55000

# ── 资源获取规则（原 gains.txt） ────────────────────────────
# type 取值：every_n_days | weekly | monthly_day | monthly_week

[[resources.gain_rules]]
type = "every_n_days"
param = "1"
gains = { draw_resource = 60 }

[[resources.gain_rules]]
type = "monthly_day"
param = "1"
gains = { exchange_currency = 50 }

# ── 指定日期覆盖（原 gains.txt day: 行） ────────────────────
[[resources.day_overrides]]
day = 0
gains = { draw_resource = 200 }

[[resources.day_overrides]]
day = 21
gains = { draw_resource = 200 }

[[resources.day_overrides]]
day = 42
gains = { draw_resource = 200 }

[[resources.day_overrides]]
day = 63
gains = { draw_resource = 200 }

[[resources.day_overrides]]
day = 84
gains = { draw_resource = 200 }

[[resources.day_overrides]]
day = 105
gains = { draw_resource = 200 }

[[resources.day_overrides]]
day = 126
gains = { draw_resource = 200 }

[[resources.day_overrides]]
day = 147
gains = { draw_resource = 200 }

